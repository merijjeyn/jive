[project]
name = "jive-harbor"
version = "0.1.0"
description = "Standalone Harbor integration for Jive"
requires-python = ">=3.12"
dependencies = ["harbor==0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jive_harbor"]
